name: Data Processing Workflow

on: workflow_dispatch
 
jobs:
  generate-data:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        data-type: ["type-a", "type-b", "type-c"]
    outputs:
      data-files: ${{ steps.generate.outputs.data-files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate data
        id: generate
        run: |
          mkdir -p output
          echo "Generating data for ${{ matrix.data-type }}"
          echo "Sample data for ${{ matrix.data-type }}" > output/data-${{ matrix.data-type }}.txt
          echo "data-files=output/data-${{ matrix.data-type }}.txt" >> $GITHUB_OUTPUT

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.data-type }}
          path: output/data-${{ matrix.data-type }}.txt

  combine-and-upload:
    runs-on: ubuntu-latest
    needs: generate-data
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine data
        run: |
          mkdir -p combined
          cat artifacts/data-type-*/*.txt > combined/combined-data.txt
          echo "Combined all data into combined/combined-data.txt"

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: combined-data
          path: combined/combined-data.txt
